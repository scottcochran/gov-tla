# TLC row lists and TLAPS proofs, rerun in the tla-kit image that tools/TLA-KIT-PIN names, and compared with the
# committed results files. CI never writes a results file: a difference fails the job and the fresh file is kept
# as an artifact, for reading. Committed files are regenerated by hand, as new dated files.
#
# tlc:    scripts/tlc_rows.py over rows/<Module>-rows.txt, compared in full (scripts/compare_results.py tlc).
# proofs: scripts/proof_results.py for each <Module>_proof.tla. While tools/TLAPS-PIN and the image name different
#         prover builds, run with TLAPM_UNPINNED=1 and compared by obligation count only; once they name the same
#         build, compared in full.
#
# Each module is one job. A row list takes up to two hours on a 2-CPU runner, so a pull request or push runs only
# the modules its changes can affect (scripts/ci_plan.py); a manual run with `all` runs every one.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Run every module, whatever changed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tlc: ${{ steps.plan.outputs.tlc }}
      proofs: ${{ steps.plan.outputs.proofs }}
      proof_mode: ${{ steps.plan.outputs.proof_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] && [ "$ALL" = true ]; then
            python3 scripts/ci_plan.py --all
          elif [ "$EVENT" = pull_request ]; then
            git diff --name-only "$PR_BASE"...HEAD | python3 scripts/ci_plan.py
          elif [ "$EVENT" = push ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD | python3 scripts/ci_plan.py
          else
            python3 scripts/ci_plan.py --all
          fi | tee -a "$GITHUB_OUTPUT"
          kit="$(grep -E '^tlapm_sha256 ' tools/TLA-KIT-PIN | cut -d' ' -f2)"
          pinned="$(grep -E '^binary_sha256 ' tools/TLAPS-PIN | cut -d' ' -f2)"
          echo "proof_mode=$([ "$kit" = "$pinned" ] && echo full || echo counts)" | tee -a "$GITHUB_OUTPUT"

  pins:
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/check-kit-pin.sh | tee pin-check.txt
          echo "image=$(tail -1 pin-check.txt)" >> "$GITHUB_OUTPUT"

  tlc:
    needs: [plan, pins]
    if: needs.plan.outputs.tlc != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.tlc) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run rows/${{ matrix.module }}-rows.txt
        env:
          IMAGE: ${{ needs.pins.outputs.image }}
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work "$IMAGE" \
            python3 scripts/tlc_rows.py "rows/$MODULE-rows.txt" -j 2 --out "out/$MODULE-results.txt"
      - name: Compare with the committed results file
        if: ${{ !cancelled() && hashFiles(format('out/{0}-results.txt', matrix.module)) != '' }}
        env:
          MODULE: ${{ matrix.module }}
        run: python3 scripts/compare_results.py tlc "$MODULE" "out/$MODULE-results.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tlc-${{ matrix.module }}
          path: out/
          if-no-files-found: ignore

  proofs:
    needs: [plan, pins]
    if: needs.plan.outputs.proofs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.proofs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove ${{ matrix.module }}_proof.tla
        env:
          IMAGE: ${{ needs.pins.outputs.image }}
          MODULE: ${{ matrix.module }}
          # Working output while the pins differ: the file names the image's prover, not tools/TLAPS-PIN's.
          UNPINNED: ${{ needs.plan.outputs.proof_mode == 'counts' && '1' || '' }}
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -e TLAPM_UNPINNED="$UNPINNED" -v "$PWD:/work" -w /work "$IMAGE" \
            python3 scripts/proof_results.py "$MODULE" --threads 2 --out "out/$MODULE-proof-results.txt"
      - name: Compare with the committed proof results file
        if: ${{ !cancelled() && hashFiles(format('out/{0}-proof-results.txt', matrix.module)) != '' }}
        env:
          MODULE: ${{ matrix.module }}
          MODE: ${{ needs.plan.outputs.proof_mode }}
        run: |
          python3 scripts/compare_results.py proof "$MODULE" "out/$MODULE-proof-results.txt" \
            $([ "$MODE" = counts ] && echo --counts-only)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: proofs-${{ matrix.module }}
          path: out/
          if-no-files-found: ignore
