\* TLC configuration for Judiciary.tla, used by visualize_states.py,
\* simulate_trace.py and ad hoc runs. The checked results come from
\* rows/Judiciary-rows.txt (scripts/tlc_rows.py), which writes its own
\* configs at much smaller constants: the state space here is far too
\* large to check exhaustively.
\* Four court identifiers (a Supreme Court and three Congress may
\* establish), two States, one case, every head of jurisdiction.

SPECIFICATION Spec

CONSTANTS
  Mut          = "none"
  Persons      = {A, B, C, D, E, F, G}
  House        = {A, B, C}
  Senate       = {D, E}
  States       = {S1, S2}
  CourtIds     = {SC, CA1, D1, T1}
  SupremeCourt = SC
  Cases        = {x1}
  Kinds        = {"Federal", "Diversity", "Ambassador", "StateIsParty",
                  "AgainstState", "Crime", "Treason"}
  MaxSeats     = 1
  MaxSalary    = 1
  NoOne        = NoOne

INVARIANTS
  TypeOK
  Safety
