\* TLC configuration for Elections.tla, for ad hoc runs and simulation. The
\* checked results come from rows/Elections-rows.txt (scripts/tlc_rows.py),
\* which writes its own configurations.
\* Three seats in the college, the electors of e1 and e2 held to their
\* pledges and e3's free; two candidates, both mortal; every elector's vote
\* open to objection; three States and three Senators for a contingent
\* election. Liveness (ExecutiveIsFilled) needs SPECIFICATION FairSpec.

SPECIFICATION Spec

CONSTANTS
  Mut         = "none"
  Persons     = {a, b, e1, e2, e3, sp}
  Electors    = {e1, e2, e3}
  Candidates  = {a, b}
  Eligible    = {a, b, sp}
  Disabled    = {}
  Officers    = {}
  Mortal      = {a, b}
  Inhabitants = {{e1, a}, {e2, b}}
  Binding     = {e1, e2}
  Contestable = {e1, e2, e3}
  States      = {t1, t2, t3}
  Senators    = {n1, n2, n3}
  Successor   = sp
  NoOne       = NoOne

INVARIANTS
  TypeOK
  Safety
