\* TLC configuration for SenateRules.tla, for ad hoc runs. The checked results
\* come from rows/SenateRules-rows.txt (scripts/tlc_rows.py), which writes its
\* own configurations. Seven Senators, so a majority (four) is short of
\* three-fifths (five); one bill, one nomination, one reconciliation bill.
\* For liveness, use SPECIFICATION FairSpec or NuclearSpec and
\* PROPERTY MajorityPrevails.

SPECIFICATION Spec

CONSTANTS
  Mut             = "none"
  Senators        = {s1, s2, s3, s4, s5, s6, s7}
  Legislation     = {law}
  Nominations     = {nom}
  Reconciliations = {rec}

INVARIANTS
  TypeOK
  Safety
