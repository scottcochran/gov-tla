\* TLC configuration for Government.tla
\* Two agencies Congress may create and one inferior court it may establish,
\* the module as specified (Mut = "none"), and every amendment, suit and
\* enabling act allowed. The exhaustive state space at these constants is
\* very large; rows/Government-rows.txt checks the module at small ones.

SPECIFICATION FairSpec

CONSTANTS
  Agencies = {ag1, ag2}
  Courts   = {ct1}
  Mut      = "none"
  Proposable     <- AmendIds
  Standing       <- Labels
  ExecOptions    = {TRUE, FALSE}
  RemoverOptions <- Removers
  VestingOptions <- Vesters

INVARIANTS
  TypeOK
  Safety

PROPERTIES
  TextChangesOnlyByArticleV
  StatutesChangeOnlyByLawOrCourt
  UnconstitutionalEdgesAreStruck
