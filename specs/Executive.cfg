\* TLC configuration for Executive.tla: the visualization tools
\* (visualize_states.py, simulate_trace.py) and ad hoc runs. The checked
\* results come from rows/Executive-rows.txt (scripts/tlc_rows.py), which
\* writes its own configurations.
\* One agency, the six statutes of KnownCharters, one treaty, one member of
\* Congress, two persons eligible to be President, one other, a 1-day acting
\* limit. Liveness (ActingEventuallyEnds) needs SPECIFICATION SpecLive.

SPECIFICATION Spec

CONSTANTS
  Mut         = "none"
  Persons     = {sen, f, g, o}
  House       = {}
  Senate      = {sen}
  Eligible    = {f, g}
  Agencies    = {a1}
  Treaties    = {t1}
  ActingLimit = 1
  NoOne       = NoOne

CONSTANT Charters <- KnownCharters

INVARIANTS
  TypeOK
  Safety
