\* TLC configuration for Constitution.tla, for ad hoc runs and for
\* visualize_states.py / simulate_trace.py (which keep only SPECIFICATION and
\* CONSTANTS). The checked results come from rows/Constitution-rows.txt via
\* scripts/tlc_rows.py, which writes its own configs; these constants are the
\* row list's defaults: one member per House, two persons eligible to be
\* President, four States, one bill, one office, one amendment.
\* With these, the invariants below take about a minute (634,620 states).

SPECIFICATION FairSpec

CONSTANTS
  Mut                = "none"
  Persons            = {h1, s1, p1, p2}
  House              = {h1}
  Senate             = {s1}
  Eligible           = {p1, p2}
  States             = {t1, t2, t3, t4}
  Bills              = {b1}
  RevenueBills       = {b1}
  Offices            = {o1}
  Amendments         = {a1}
  SuffrageAmendments = {a1}
  NoOne              = NoOne

CONSTRAINT
  ElectionsBound

INVARIANTS
  TypeOK
  Safety

PROPERTIES
  PresentedBillsResolve
