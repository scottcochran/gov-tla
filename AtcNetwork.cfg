\* TLC configuration for AtcNetwork.tla, for ad hoc runs and simulation. The
\* checked results come from rows/AtcNetwork-rows.txt (scripts/tlc_rows.py),
\* which writes its own configurations.
\* Two sites, a backup with room for one, three physical events. The system
\* terminates (the environment is finite), so run with -deadlock. Liveness
\* (Converges, NoSiteStranded) needs SPECIFICATION SpecLive.

SPECIFICATION Spec

CONSTANTS
  Mut       = "none"
  Sites     = {s1, s2}
  BakCap    = 1
  MaxEvents = 3

INVARIANTS
  TypeOK
  Safety
  StopsOnlyWhenQuiet
